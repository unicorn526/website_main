{% extends "layout.html" %}

{% block head %}
    {{ super() }}
{% endblock %}

{% block title %}
    AI 問答
{% endblock %}

{% block main %}
    <img src="../static/images/trianglify_background.png" class="background position-fixed w-100 h-100 top-0 start-0" loading="lazy">
    
    <div class="container contact mb-5 pb-5">
        <div class="row mb-3">
            <div class="col-md-12 text-center">
                <h1 class="page-title">AI 問答助手</h1>
                <p class="text-muted">基於 OpenAI GPT-4o-mini 模型</p>
            </div>
        </div>

        <div class="card contact-card card-design px-5 py-5 mb-4">
            <form action="{{ url_for('ai_chat') }}" method="post">
                <div class="form-group mb-4">
                    <label for="prompt" class="mb-2 fw-bold">&nbsp;&nbsp;&nbsp;<i class="arrow bx bxs-right-arrow"></i>請問有什麼我可以幫忙的？</label>
                    <textarea class="form-control" id="prompt" name="prompt" rows="3" placeholder="請輸入您的問題..." required></textarea>
                </div>
                
                <div class="form-group text-center mt-4 mb-2">
                    <button type="submit" class="btn mx-auto mt-auto w-50">發送問題 <i class="bx bx-send px-2"></i></button>
                </div>
            </form>
        </div>

        {% if response %}
        <div class="card description-card card-design px-5 py-4">
            <div class="card-body">
                <h5 class="fw-bold mb-3"><i class="bx bx-bot"></i> AI 回覆：</h5>
                <p style="white-space: pre-wrap; line-height: 1.8;">{{ response }}</p>
            </div>
        </div>
        {% endif %}
        
    </div>
{% endblock %}
