{% extends "layout.html" %}

{% block title %}AI 繪圖 | 盧柏安{% endblock %}

{% block main %}
    <img src="../static/images/trianglify_background.png" class="background position-fixed w-100 h-100 top-0 start-0" loading="lazy">
    
    <div class="container contact mb-5 pb-5">
        <div class="row mb-3">
            <div class="col-md-12 text-center">
                <h1 class="page-title">AI 圖像生成</h1>
            </div>
        </div>

        <div class="card contact-card card-design px-5 py-5">
            <form action="{{ url_for('generate_image') }}" method="post">
                <div class="form-group mb-3">
                    <label for="prompt">&nbsp;&nbsp;&nbsp;<i class="arrow bx bxs-right-arrow"></i>請描述您想生成的畫面</label>
                    <textarea class="form-control" id="prompt" name="prompt" rows="3" placeholder="例如：一隻戴著墨鏡在宇宙中衝浪的貓..." required></textarea>
                </div>
                
                <div class="form-group mb-4">
                    <label for="size">&nbsp;&nbsp;&nbsp;<i class="arrow bx bxs-right-arrow"></i>選擇圖片尺寸</label>
                    <select class="form-control" id="size" name="size" required>
                        <option value="256x256">256 x 256</option>
                        <option value="512x512" selected>512 x 512</option>
                        <option value="1024x1024">1024 x 1024</option>
                    </select>
                </div>
                
                <div class="form-group text-center mt-4 mb-2">
                    <button type="submit" class="btn mx-auto mt-auto w-50">生成圖片 <i class="bx bx-image-add px-2"></i></button>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
